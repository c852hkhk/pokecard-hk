    // State Container
    const state = {
      lang: 'zh-HK',
      currency: 'HKD',
      role: 'buyer', // 'buyer' | 'seller'
      inventory: [...INITIAL_INVENTORY],
      shops: [...SHops_DATABASE],
      
      // Filter parameters
      searchQuery: '',
      selectedDistrict: 'all',
      selectedLanguage: 'all',
      selectedCondition: 'all',
      selectedMerchantType: 'all',
      selectedCard: null, // Selected card details page

      // Verified Membership State
      currentUser: null,
      authModalOpen: false,
      authStep: 1,
      authMethod: 'phone',
      inputPhone: '',
      inputEmail: '',
      inputOTP: '',
      inputNickname: '',
      
      // Selected elements for detail Modals
      contactModalShop: null,
      currentSelectedNews: null,
      tosModalOpen: false,
      isListening: false
    };

    const EXCHANGE_RATES = { HKD: 1, JPY: 19.52, USD: 0.128 };
    const CURRENCY_SYMBOLS = { HKD: 'HK$', JPY: '¥', USD: '$' };

    // Localization translator helper
    function t(key) {
      return DICTIONARY[state.lang][key] || DICTIONARY['zh-HK'][key] || key;
    }

    // Dynamic Currency conversions
    function formatConvertedPrice(hkdPrice) {
      const converted = hkdPrice * EXCHANGE_RATES[state.currency];
      const symbol = CURRENCY_SYMBOLS[state.currency];
      if (state.currency === 'JPY') {
        return `${symbol}${Math.round(converted).toLocaleString()}`;
      }
      return `${symbol}${converted.toFixed(2)}`;
    }

    // Toast notification manager
    function triggerToast(message) {
      const wrapper = document.getElementById('toast-wrapper');
      const toastId = `toast-${Date.now()}`;
      const toastHTML = `
        <div id="${toastId}" class="bg-slate-900 border-2 border-yellow-500/50 text-yellow-400 px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-2 font-bold text-sm transform transition duration-300 translate-y-5 opacity-0 pointer-events-auto">
          <i data-lucide="sparkles" class="w-5 h-5 shrink-0 text-yellow-400"></i>
          <span>${message}</span>
        </div>
      `;
      wrapper.insertAdjacentHTML('beforeend', toastHTML);
      lucide.createIcons();

      const element = document.getElementById(toastId);
      setTimeout(() => element.classList.remove('translate-y-5', 'opacity-0'), 10);
      setTimeout(() => {
        element.classList.add('translate-y-5', 'opacity-0');
        setTimeout(() => element.remove(), 300);
      }, 3000);
    }

    // Live Marquee Rendering
    function renderLiveMarquee() {

        { platform: "🌎 eBay", card: "Pikachu ex SAR", value: 1250, change: "+5.1%", trend: "up" },
        { platform: "🇹🇼 蝦皮", card: "甲賀忍蛙 ex", value: 1650, change: "+1.8%", trend: "up" },

      let innerHTML = '';
      [...tickerFeed, ...tickerFeed].forEach(feed => {

        innerHTML += `

            <span class="text-slate-300 font-black">${formatConvertedPrice(feed.value)}</span>

      marqueeContainer.innerHTML = `

    // Membership Port Management (Phone/Email verification tabs)
    function openAuthModal() {
      state.authModalOpen = true;
      state.authStep = 1;
      state.authMethod = 'phone';
      state.inputPhone = '';
      state.inputEmail = '';
      state.inputOTP = '';

      state.authMethod = method;

    function handleSendOTP() {
      // 1. HoneyPot Validation
      const honeypotVal = document.getElementById('auth_username_hp')?.value;
      if (honeypotVal) {
        console.warn('Bot access registered by honeyPot intercept.');
        return;
      }

      // 2. Cloudflare Turnstile human confirmation
      const turnstileChecked = document.getElementById('cf-turnstile-mock')?.checked;
      if (!turnstileChecked) {
        alert(state.lang === 'en' ? 'Turnstile verification failed. Please check the checkbox.' : '安全驗證失敗：請確認勾選 Turnstile 人機驗證！');
        return;
      }

      // 3. Inputs
      const targetVal = state.authMethod === 'phone' 
        ? document.getElementById('reg-phone')?.value 
        : document.getElementById('reg-email')?.value;

      if (!targetVal) {
        alert(state.lang === 'en' ? 'Please fill in credentials.' : '請輸入正確的註冊資料！');
        return;
      }

      state.authStep = 2;
      triggerToast(state.lang === 'en' ? "🔑 Code 123456 sent!" : "🔑 模擬驗證碼 [123456] 已發送！");
      renderModals();
    }

    function verifyAndRegisterUser() {
      // 1. Verify checkbox validation
      const agreeChecked = document.getElementById('agree-terms')?.checked;
      if (!agreeChecked) {
        alert(state.lang === 'en' ? 'You must accept the terms first.' : '您必須先閱讀並勾選同意《服務條款與免責聲明》！');
        return;
      }

      const otpCodeInput = document.getElementById('reg-otp')?.value;
      const nicknameInput = document.getElementById('reg-name')?.value;

      if (otpCodeInput !== '123456') {
        alert(state.lang === 'en' ? 'Incorrect verification code. Use 123456.' : '驗證碼錯誤！請輸入預設代碼 123456');
        return;
      }

      if (!nicknameInput) {
        alert(state.lang === 'en' ? 'Please choose a nickname.' : '請輸入會員暱稱！');
        return;
      }

      state.currentUser = {
        name: nicknameInput,
        credentials: state.authMethod === 'phone' ? state.inputPhone : state.inputEmail,
        displayId: state.authMethod === 'phone' ? 'HK+852' : 'E-Mail',
        role: 'buyer'
      };

      state.authModalOpen = false;
      triggerToast(state.lang === 'en' ? "🎉 Welcome, registration complete!" : "🎉 歡迎加入 PokeCardHK！會員安全認證成功。");
      renderApp();
    }

    function handleLogout() {
      state.currentUser = null;
      triggerToast(state.lang === 'en' ? "Logged out successfully." : "已成功登出會員帳號。");
      renderApp();
    }

    // Voice recognition search execution
    function runVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        triggerToast("瀏覽器不支援 Web Speech 語音辨識功能。");
        return;
      }
      if (state.isListening) return;

      const recognition = new SpeechRecognition();
      recognition.lang = state.lang === 'en' ? 'en-US' : 'zh-HK';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        state.isListening = true;
        renderApp();
        triggerToast("🎤 正在聆聽，請說出卡牌名稱...");
      };

      recognition.onerror = () => {
        state.isListening = false;
        renderApp();
        triggerToast("⚠️ 語音識別失敗，請嘗試手動輸入。");
      };

      recognition.onend = () => {
        state.isListening = false;
        renderApp();
      };

      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript.replace(/[.。!！?？]/g, '');
        state.searchQuery = text;
        renderApp();
        triggerToast(`語音辨識結果: "${text}"`);
      };

      recognition.start();
    }

    // Mock Image OCR capture scanning
    function runImageOCRScan(event) {
      const file = event.target.files[0];
      if (!file) return;

      triggerToast("📸 AI 智慧卡圖識別中...");
      setTimeout(() => {
        // Randomly identify one of our main cards
        const randomCard = MASTER_CARDS[Math.floor(Math.random() * MASTER_CARDS.length)];
        state.selectedCard = randomCard;
        state.searchQuery = randomCard.name[state.lang] || randomCard.name['zh-HK'];
        renderApp();
        triggerToast(`✅ 成功辨識卡片: ${randomCard.name[state.lang] || randomCard.name['zh-HK']}`);
      }, 1500);
    }

    // Dynamic Beautiful TCG Vector Card HTML generator (avoid 404 image errors)
    function getTcgCardArtHTML(card) {
      let gradient = "from-orange-500 to-red-600";
      let elementSymbol = "🔥";
      let characterSvg = "";

      if (card.type === "fire") { 
        gradient = "from-red-500 via-orange-600 to-amber-700"; 
        elementSymbol = "🔥";
        characterSvg = `<path d="M12 2s.5 2.5 1.5 3.5c1 1 2 2.5 1.5 4.5-.5 2-2.5 3-2.5 5s1 2.5 2 2.5" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      } else if (card.type === "lightning") { 
        gradient = "from-yellow-400 via-amber-500 to-yellow-600"; 
        elementSymbol = "⚡️";
        characterSvg = `<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>`;
      } else if (card.type === "grass") { 
        gradient = "from-emerald-500 via-green-600 to-teal-800"; 
        elementSymbol = "🌿";
        characterSvg = `<path d="M12 2c0 0-4 4-4 8s4 6 4 12c0 0 4-8 4-12" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>`;
      } else if (card.type === "water") { 
        gradient = "from-blue-500 via-cyan-600 to-slate-900"; 
        elementSymbol = "💧";
        characterSvg = `<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>`;
      } else if (card.type === "psychic") { 
        gradient = "from-purple-600 via-pink-600 to-indigo-900"; 
        elementSymbol = "🔮";
        characterSvg = `<circle cx="12" cy="12" r="7" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>`;
      } else if (card.type === "dragon") { 
        gradient = "from-yellow-600 via-amber-500 to-amber-950"; 
        elementSymbol = "🐉";
        characterSvg = `<path d="M12 4c-4 0-6 2-6 5s3 4 5 7" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>`;
      } else if (card.type === "darkness") { 
        gradient = "from-slate-800 via-indigo-950 to-slate-950"; 
        elementSymbol = "👁️";
        characterSvg = `<path d="M12 3a9 9 0 1 0 9 9h-9V3z" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>`;
      } else if (card.type === "colorless") { 
        gradient = "from-stone-400 via-slate-300 to-stone-600"; 
        elementSymbol = "⭐";
        characterSvg = `<path d="M12 2l3.09 6.26L22 9.27l-5 4.87" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none"/>`;
      } else if (card.type === "supporter") { 
        gradient = "from-pink-300 via-purple-400 to-indigo-500"; 
        elementSymbol = "👔";
        characterSvg = `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>`;
      }

      const hpText = card.hp ? `<span class="bg-slate-950/70 backdrop-blur text-white text-[10px] font-black px-2 py-0.5 rounded-full">${card.hp} HP</span>` : "";

      return `
        <div class="relative w-full h-full bg-gradient-to-br ${gradient} rounded-2xl p-4 flex flex-col justify-between overflow-hidden shadow-2xl transition duration-500 group-hover:scale-[1.03]">
          <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/10 to-white/0 transform -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-out pointer-events-none"></div>
          
          <div class="flex justify-between items-start z-10">
            <span class="bg-slate-950/80 border border-white/10 text-slate-300 text-[9px] font-black font-mono px-2 py-0.5 rounded backdrop-blur">
              ${card.id}
            </span>
            <div class="flex gap-1 items-center">
              ${hpText}
              <span class="text-xs">${elementSymbol}</span>
            </div>
          </div>

          <div class="absolute inset-0 flex items-center justify-center opacity-35 z-0">
            <svg class="w-24 h-24" viewBox="0 0 24 24" fill="none">
              ${characterSvg}
            </svg>
          </div>

          <div class="space-y-1.5 z-10">
            <div class="flex items-center gap-1.5">
              <span class="bg-yellow-400 text-slate-950 text-[9px] font-black px-1.5 py-0.5 rounded tracking-wider shadow">
                ${card.rarity}
              </span>
              <span class="text-white/80 font-mono text-[9px]">${card.number}</span>
            </div>
            <h4 class="font-black text-xs sm:text-sm text-white drop-shadow-md leading-tight tracking-tight">
              ${card.name[state.lang] || card.name['zh-HK']}
            </h4>
          </div>
        </div>
      `;
    }

    // App core renderer
    function renderApp() {

          : 'text-slate-400 hover:text-slate-100'
      }`;

      // Refresh marquee structure and core content area
      renderLiveMarquee();

    // Dynamic filtration handling
    function setOfferFilter(field, value) {
      state[field] = value;
      renderOfferListing();
    }

    // Selector back to inventory homepage view
    function backToHome() {
      state.selectedCard = null;
      renderApp();
    }

    function renderMainContent() {
      const container = document.getElementById('main-content');
      
      // Determine View Layout
      if (state.role === 'buyer') {
        if (!state.selectedCard) {
          renderBuyerHomeView(container);
        } else {
          renderBuyerDetailView(container);
        }
      } else {
        renderSellerDashboardView(container);
      }
      lucide.createIcons();
    }

    // Render Buyer Homepage Grid Layout
    function renderBuyerHomeView(container) {
      // Catalog matching
      const query = state.searchQuery.trim().toLowerCase();
      const matchedCards = MASTER_CARDS.filter(card => {
        const cardTitle = (card.name[state.lang] || card.name['zh-HK'] || '').toLowerCase();
        return cardTitle.includes(query) || card.id.toLowerCase().includes(query) || card.set.toLowerCase().includes(query);
      });

      let catalogHTML = '';
      if (matchedCards.length === 0) {
        catalogHTML = `
          <div class="col-span-full bg-slate-900/50 rounded-2xl p-10 text-center border border-slate-800">
            <i data-lucide="alert-circle" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
            <p class="text-slate-400 font-semibold">找不到任何匹配的閃卡</p>
            <p class="text-slate-500 text-xs mt-1">試試輸入 「噴火龍」, 「皮卡丘」, 「伊布」 或 「SAR」</p>
          </div>
        `;
      } else {
        matchedCards.forEach(card => {
          const shopOffers = state.inventory.filter(inv => inv.cardId === card.id && inv.status === 'active' && inv.qty > 0);
          const hasOffer = shopOffers.length > 0;
          const minPrice = hasOffer ? Math.min(...shopOffers.map(o => o.price)) : null;

          const actionLabel = hasOffer ? `看 ${shopOffers.length} 間商家報價` : "查看詳情";
          const pricingTextHTML = hasOffer 
            ? `<p class="text-base font-black text-emerald-400">${formatConvertedPrice(minPrice)} <span class="text-[10px] font-normal text-slate-400">起</span></p>`
            : `<p class="text-xs font-semibold text-slate-500">暫時缺貨</p>`;

          catalogHTML += `
            <div onclick="selectProductCard('${card.id}')" class="bg-slate-900 rounded-2xl border border-slate-800 hover:border-slate-700 p-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-xl group flex flex-col justify-between">
              <div class="space-y-4">
                <div class="h-44 rounded-xl relative overflow-hidden">
                  ${getTcgCardArtHTML(card)}
                </div>
                <div>
                  <p class="text-slate-400 text-xs line-clamp-1">${card.set}</p>
                </div>
              </div>

              <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                <div>
                  <p class="text-[9px] text-slate-500">全港最低現貨價</p>
                  ${pricingTextHTML}
                </div>
                <div class="flex items-center gap-1 text-[11px] text-yellow-400 font-bold group-hover:underline">
                  ${actionLabel}
                  <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </div>
              </div>
            </div>
          `;

    // Filters and sorting of matching inventory listings
    function renderOfferListing() {
      const container = document.getElementById('offers-list-container');
      if (!container) return;

      const card = state.selectedCard;
      const matchedListings = state.inventory
        .filter(item => item.cardId === card.id && item.status === 'active' && item.qty > 0)
        .map(item => {
          const shopObj = state.shops.find(sh => sh.id === item.shopId);
          return { ...item, shop: shopObj };
        })
        .filter(offer => {
          if (!offer.shop) return false;
          const matchMerchant = state.selectedMerchantType === 'all' || offer.shop.shopType === state.selectedMerchantType;
          const matchDistrict = state.selectedDistrict === 'all' || offer.shop.district === state.selectedDistrict;
          const matchLang = state.selectedLanguage === 'all' || offer.language === state.selectedLanguage;
          const matchCond = state.selectedCondition === 'all' || offer.condition === state.selectedCondition;
          return matchMerchant && matchDistrict && matchLang && matchCond;
        })
        .sort((a, b) => a.price - b.price);

      if (matchedListings.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-slate-950/40 rounded-2xl border border-slate-800/60 text-slate-500 text-xs">
            <i data-lucide="info" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
            暫時沒有符合篩選條件的報價
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let innerHTML = '';
      matchedListings.forEach((offer, idx) => {
        const cheapestTagHTML = idx === 0 ? `<div class="absolute top-0 right-0 bg-yellow-400 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded-bl uppercase tracking-wider">${t('cheapestTag')}</div>` : '';

          ? `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[10px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="building-2" class="w-3 h-3"></i>${t('physicalShop')}</span>`
          : `<span class="bg-purple-500/10 text-purple-400 border border-purple-500/20 text-[10px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="laptop" class="w-3 h-3"></i>${t('onlineMerchant')}</span>`;

        innerHTML += `
          <div class="bg-slate-950 p-4 rounded-2xl border transition relative ${idx === 0 ? 'border-yellow-500/50 shadow-lg shadow-yellow-500/5 overflow-hidden' : 'border-slate-800 hover:border-slate-700'}">

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div class="space-y-1.5">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="font-extrabold text-slate-100">${offer.shop.name}</span>
                  ${merchantBadgeHTML}
                  <span class="bg-slate-900 border border-slate-800 px-1.5 py-0.5 rounded text-[10px] text-yellow-400 font-bold">★ ${offer.shop.rating.toFixed(1)}</span>
                </div>
                
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-400">
                  <span class="flex items-center gap-1 text-amber-400 font-medium">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>

                  ${t('contactShop')}

    // Listing Management Handlers
    function updateListingPrice(itemId, priceVal) {
      const targetHkd = Number(priceVal) / EXCHANGE_RATES[state.currency];
      const item = state.inventory.find(inv => inv.id === itemId);
      if (item) {
        item.price = targetHkd;
        triggerToast("價格修改成功！");
      }
    }

    function updateListingQty(itemId, qtyVal) {
      const item = state.inventory.find(inv => inv.id === itemId);
      if (item) {
        item.qty = Number(qtyVal);
        triggerToast("庫存數量已更新！");
      }
    }

    function toggleListingState(itemId) {
      const item = state.inventory.find(inv => inv.id === itemId);
      if (item) {
        item.status = item.status === 'active' ? 'inactive' : 'active';
        renderApp();
      }
    }

    function deleteListingItem(itemId) {
      state.inventory = state.inventory.filter(inv => inv.id !== itemId);
      triggerToast("🗑️ 商品已從平台下架。");
      renderApp();
    }

    function handleSellerPublish(e) {
      e.preventDefault();
      const cardId = document.getElementById('new-card-id').value;
      const language = document.getElementById('new-lang').value;
      const condition = document.getElementById('new-cond').value;
      const priceVal = Number(document.getElementById('new-price').value);
      const qtyVal = Number(document.getElementById('new-qty').value);

      const priceInHkd = priceVal / EXCHANGE_RATES[state.currency];

      const newListing = {
        id: `inv-${Date.now()}`,
        shopId: "shop-1",
        cardId: cardId,
        price: priceInHkd,
        qty: qtyVal,
        condition: condition,
        language: language,
        status: "active"
      };

      state.inventory.unshift(newListing);
      triggerToast("✨ 成功發布新閃卡商品！已同步至買家格價端。");
      renderApp();
    }

    // Startup Initializations

  <div id="new-search-module" class="my-6 p-4 border border-yellow-500/30 bg-slate-900 rounded-xl">
    <div class="flex gap-2">
        <input type="text" id="myCardSearch" placeholder="搜尋卡片..." class="flex-1 p-3 rounded-lg bg-slate-800 text-white border border-slate-700">
        <button onclick="performSearch()" class="bg-yellow-500 text-slate-950 px-6 py-2 rounded-lg font-black hover:bg-yellow-400 transition">搜尋</button>
    </div>
    <div id="searchResults" class="mt-4"></div>
</div>
<script>
function performSearch() {
    const query = document.getElementById('myCardSearch').value;
    const resultArea = document.getElementById('searchResults');
    if(!query) return alert('請輸入卡名或屬性');
    
    resultArea.innerHTML = '<p class="text-slate-400 text-center animate-pulse">搜尋中...</p>';
    
    // 關鍵改動：將 pageSize 增加到 20，並優化搜尋參數
    // 如果你打「火」，API 會嘗試搵卡名含有「火」字或者屬性相關嘅卡
    fetch(`https://api.pokemontcg.io/v2/cards?q=name:${query}*&pageSize=20`)
        .then(res => res.json())
        .then(data => {
            if(data.data && data.data.length > 0) {
                resultArea.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-4"></div>`;
                const grid = resultArea.querySelector('.grid');
                
data.data.forEach(card => {
    // 1. 先確認圖片是否存在，如果不存在就給一張預設圖，避免出現破碎圖示
    const imageUrl = card.images && card.images.small ? card.images.small : 'https://via.placeholder.com/245x342?text=No+Image';
    
    const cardElement = document.createElement('div');
    cardElement.className = "bg-slate-800 p-2 rounded-lg border border-slate-700 hover:border-yellow-500 transition shadow-md";
    
    // 2. 加入 img 的 error 事件，如果圖片載入失敗，隱藏該圖片區塊
    cardElement.innerHTML = `
        <img src="${imageUrl}" 
             class="w-full h-auto rounded object-cover" 
             alt="${card.name}" 
             onerror="this.style.display='none'">
        <p class="text-[10px] text-white mt-2 font-bold truncate text-center">${card.name}</p>
    `;
    
    grid.appendChild(cardElement);
});
            } else {
                resultArea.innerHTML = '<p class="text-red-400 text-center">搵唔到相關結果，試吓打英文（例如: Fire）。</p>';
            }
        });
}
</script>
